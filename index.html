<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון חלוקת מלגות</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 90px;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }
        
        .info-box strong {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        
        .info-box ul {
            margin-right: 15px;
            padding: 0;
        }
        
        .info-box li {
            margin-bottom: 4px;
            color: #666;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        
        .results.show {
            display: block;
        }
        
        .result-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .understanding {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }
        
        .table-container {
            overflow-x: auto;
            margin: 20px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: right;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:last-child td {
            border-bottom: 2px solid #ddd;
            font-weight: 600;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .summary-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #eee;
        }
        
        .summary-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .summary-value {
            font-size: 20px;
            color: #333;
            font-weight: 700;
        }
        
        .success {
            background: #f0fdf4;
            border: 1px solid #22c55e;
            color: #16a34a;
        }
        
        .warning {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #b45309;
        }
        
        .error-message {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .api-key-input {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .api-key-input input {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 מחשבון חלוקת מלגות</h1>
        <p class="subtitle">חלקו מלגות בחכמה על פי תקציב ומדיניות</p>
        
        <div id="formSection">
            <div class="api-key-input">
                <label for="apiKey">🔑 API Key (מ-Anthropic):</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="sk-ant-v7-..." 
                    required
                >
                <small style="color: #999; display: block; margin-top: 4px;">
                    <a href="https://console.anthropic.com/" target="_blank" style="color: #667eea;">קבלו API Key בחינם כאן</a>
                </small>
            </div>
            
            <div class="form-group">
                <label for="budget">💰 התקציב הכולל (ש״ח)</label>
                <input 
                    type="number" 
                    id="budget" 
                    placeholder="100000" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="studentCount">👥 מספר הסטודנטים המשוער</label>
                <input 
                    type="number" 
                    id="studentCount" 
                    placeholder="200" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="policy">📝 המדיניות שלכם (בשפה חופשית)</label>
                <div class="info-box">
                    <strong>דוגמאות:</strong>
                    <ul>
                        <li>אני רוצה לתן מלגה לכמה שיותר סטודנטים</li>
                        <li>אני רוצה מלגות גדולות (70%-60%)</li>
                        <li>אני רוצה איזון בין הרמות</li>
                        <li>חובה מלגה בכל מדרגה</li>
                    </ul>
                </div>
                <textarea 
                    id="policy" 
                    placeholder="למשל: אני רוצה לתן מלגה לכמה שיותר סטודנטים..." 
                    required
                ></textarea>
            </div>
            
            <button onclick="calculateScholarships()" id="submitBtn">
                ➜ חשבו את החלוקה
            </button>
        </div>
        
        <div id="resultsSection" class="results">
            <div class="result-title">✅ התוצאה</div>
            
            <div id="errorMessage"></div>
            
            <div id="understanding" class="understanding"></div>
            
            <div id="reasoning"></div>
            
            <div class="summary" id="summary"></div>
            
            <div class="table-container">
                <table id="resultsTable"></table>
            </div>
            
            <button onclick="resetForm()">← חזור וחשבו שוב</button>
        </div>
    </div>
    
    <script>
        const percentages = [30, 40, 50, 60, 70];
        const yearlyCost = 10000;
        
        async function calculateScholarships() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const budget = parseFloat(document.getElementById('budget').value);
            const studentCount = parseInt(document.getElementById('studentCount').value);
            const policy = document.getElementById('policy').value.trim();
            
            if (!apiKey || !budget || !studentCount || !policy) {
                showError('אנא מלאו את כל השדות');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ חושב...';
            
            try {
                const prompt = `אתה עוזר בחלוקת מלגות לסטודנטים בתוך תקציב מוגבל.

**המדיניות של המשתמש:** "${policy}"

**הנתונים:**
- התקציב הכולל: ₪${budget.toLocaleString('he-IL')}
- מספר סטודנטים משוער: ${studentCount}
- אחוזי מלגה זמינים: 30%, 40%, 50%, 60%, 70%
- שכר לימוד שנתי: ₪${yearlyCost}

בהתאם למדיניות, חשבו חלוקה אופטימלית של סטודנטים בכל רמת מלגה.

תן את התוצאה בפורמט JSON בלבד (בלי הסברים נוספים):
{
  "understanding": "הסבר קצר של המדיניות (1-2 משפטים בעברית)",
  "recommendation": {
    "30": מספר סטודנטים,
    "40": מספר סטודנטים,
    "50": מספר סטודנטים,
    "60": מספר סטודנטים,
    "70": מספר סטודנטים
  },
  "reasoning": "הסבר קצר של החישוב (1-2 משפטים)"
}`;
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-6',
                        max_tokens: 500,
                        messages: [
                            { role: 'user', content: prompt }
                        ]
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }
                
                const data = await response.json();
                const responseText = data.content[0].text;
                
                const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error('לא הצלחנו לעבד את התוצאה');
                
                const result = JSON.parse(jsonMatch[0]);
                displayResults(result, budget, studentCount);
                
            } catch (error) {
                showError('❌ שגיאה: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '➜ חשבו את החלוקה';
            }
        }
        
        function displayResults(result, budget, studentCount) {
            // הצג הבנה
            document.getElementById('understanding').textContent = '📌 המדיניות שלכם: ' + result.understanding;
            
            // הצג היגיון
            const reasoningDiv = document.getElementById('reasoning');
            reasoningDiv.innerHTML = `<div style="background: #f9f9f9; padding: 12px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; color: #666;">
                <strong>💡 ההיגיון:</strong> ${result.reasoning}
            </div>`;
            
            // חשבו סכומים
            let totalSpent = 0;
            let totalStudents = 0;
            const breakdown = {};
            
            percentages.forEach(pct => {
                const costPerStudent = yearlyCost * pct / 100;
                const count = result.recommendation[pct] || 0;
                const spent = costPerStudent * count;
                
                totalSpent += spent;
                totalStudents += count;
                
                breakdown[pct] = {
                    count,
                    costPerStudent,
                    spent
                };
            });
            
            const remaining = budget - totalSpent;
            const budgetUsagePercent = (totalSpent / budget) * 100;
            
            // הצג סיכום
            const summaryDiv = document.getElementById('summary');
            const statusClass = remaining >= 0 ? 'success' : 'warning';
            
            summaryDiv.innerHTML = `
                <div class="summary-card ${statusClass}">
                    <div class="summary-label">סה״כ סטודנטים</div>
                    <div class="summary-value">${totalStudents}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">סה״כ הוצאה</div>
                    <div class="summary-value">₪${totalSpent.toLocaleString('he-IL')}</div>
                </div>
                <div class="summary-card ${statusClass}">
                    <div class="summary-label">סכום נותר</div>
                    <div class="summary-value">₪${remaining.toLocaleString('he-IL')}</div>
                </div>
            `;
            
            // הצג טבלה
            const table = document.getElementById('resultsTable');
            let html = `
                <tr>
                    <th>אחוז</th>
                    <th>סטודנטים</th>
                    <th>עלות למישהו</th>
                    <th>סה״כ עלות</th>
                </tr>
            `;
            
            percentages.forEach(pct => {
                const item = breakdown[pct];
                html += `
                    <tr>
                        <td>${pct}%</td>
                        <td>${item.count}</td>
                        <td>₪${item.costPerStudent.toLocaleString('he-IL')}</td>
                        <td>₪${item.spent.toLocaleString('he-IL')}</td>
                    </tr>
                `;
            });
            
            html += `
                <tr>
                    <td><strong>סה״כ</strong></td>
                    <td><strong>${totalStudents}</strong></td>
                    <td></td>
                    <td><strong>₪${totalSpent.toLocaleString('he-IL')}</strong></td>
                </tr>
            `;
            
            table.innerHTML = html;
            
            // הצג תוצאות
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('resultsSection').classList.add('show');
            
            // סקרול לתוצאות
            setTimeout(() => {
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error-message">${message}</div>`;
            errorDiv.style.display = 'block';
        }
        
        function resetForm() {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('errorMessage').innerHTML = '';
            document.getElementById('policy').value = '';
            document.getElementById('budget').value = '';
            document.getElementById('studentCount').value = '';
        }
    </script>
</body>
</html>
